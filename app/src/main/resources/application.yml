spring:
  application:
    name: chapchu-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://chapchu-auth.chapchu.svc.cluster.local:9000/oauth2/jwks}
      client:
        registration:
          chapchu-auth:
            client-id: chapchu-api
            client-secret: ${CHAPCHU_API_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/auth/callback"
            scope: openid,profile,email
        provider:
          chapchu-auth:
            issuer-uri: ${AUTH_SERVER_URL}

chapchu-api:
  auth:
    callback-url: ${AUTH_CALLBACK_URL:}
    fe-redirect-url: ${FE_REDIRECT_URL:http://localhost:3000/auth/oauth}

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:placeholder}
        secret-key: ${AWS_SECRET_ACCESS_KEY:placeholder}

app:
  s3:
    bucket: ${S3_BUCKET_NAME:placeholder}

  # TOUR_API_KEY는 아직 배포 환경에 주입돼 있지 않다. 기본값을 비워 두어 키가 없어도 기동은 되게 한다.
  # DB에서 읽는 GET /places/{placeId}는 정상 동작하고, TourAPI를 호출하는 GET /places/nearby 만
  # 실패한다. 키가 준비되면 k8s Secret에 TOUR_API_KEY를 추가하면 된다 (이슈 #50 참고).
  tour-api:
    key: ${TOUR_API_KEY:}
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: 8080
  forward-headers-strategy: framework
