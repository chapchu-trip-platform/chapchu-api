<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Chapchu 로그인 테스트</title>
  <style>
    body { font-family: monospace; padding: 32px; background: #f5f5f5; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 6px; margin-right: 8px; }
    button.secondary { background: #757575; }
    input[type=text] { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 300px; margin-right: 8px; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
    h3 { margin-top: 24px; }
    .token { word-break: break-all; font-size: 12px; }
    .error { color: #f44336; }
    .onboarding-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 24px; max-width: 440px; }
  </style>
</head>
<body>
<h2>Chapchu 로그인 테스트</h2>
<div id="app"></div>

<script>
const AUTH_URL = 'https://auth.chapchu.site';
const API_URL  = 'https://api.chapchu.site';
const CLIENT_ID    = 'chapchu-front';
const REDIRECT_URI = 'https://api.chapchu.site/docs/test-login.html';

function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function pkce() {
  const verifier  = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  return { verifier, challenge };
}

async function login() {
  const { verifier, challenge } = await pkce();
  sessionStorage.setItem('cv', verifier);
  const params = new URLSearchParams({
    response_type: 'code', client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI, scope: 'openid profile email',
    code_challenge: challenge, code_challenge_method: 'S256',
  });
  location.href = `${AUTH_URL}/oauth2/authorize?${params}`;
}

async function handleCallback(code) {
  const app = document.getElementById('app');
  app.innerHTML = '<p>토큰 교환 중...</p>';

  const tokenRes = await fetch(`${AUTH_URL}/oauth2/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code', client_id: CLIENT_ID,
      redirect_uri: REDIRECT_URI, code,
      code_verifier: sessionStorage.getItem('cv'),
    }),
  });

  const tokens = await tokenRes.json();
  if (!tokens.access_token) {
    app.innerHTML = `<p class="error">토큰 교환 실패</p><pre>${JSON.stringify(tokens, null, 2)}</pre>`;
    return;
  }

  const meRes = await fetch(`${API_URL}/users/me`, {
    headers: { Authorization: `Bearer ${tokens.access_token}` },
  });
  const me = await meRes.json();

  app.innerHTML = `
    <h3>✅ 로그인 성공</h3>
    <h3>유저 정보 (/users/me)</h3>
    <pre>${JSON.stringify(me, null, 2)}</pre>
    <h3>Access Token</h3>
    <pre class="token">${tokens.access_token}</pre>
    <h3>Token 전체 응답</h3>
    <pre>${JSON.stringify(tokens, null, 2)}</pre>
    <br><button onclick="login()">다른 계정으로 로그인</button>
  `;
}

function showOnboardingForm(registrationToken) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="onboarding-box">
      <h3>닉네임을 입력해주세요</h3>
      <p>Chapchu에서 사용할 닉네임을 설정합니다.</p>
      <input type="text" id="nicknameInput" placeholder="닉네임 (최대 30자)" maxlength="30">
      <button onclick="submitNickname('${registrationToken}')">가입 완료</button>
      <p id="onboardingError" class="error"></p>
    </div>
  `;
}

async function submitNickname(registrationToken) {
  const nickname = document.getElementById('nicknameInput').value.trim();
  const errEl = document.getElementById('onboardingError');
  if (!nickname) { errEl.textContent = '닉네임을 입력해주세요.'; return; }
  errEl.textContent = '';

  const res = await fetch(`${AUTH_URL}/auth/register`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ registrationToken, nickname }),
  });

  if (!res.ok) {
    const body = await res.text();
    errEl.textContent = `가입 실패: ${res.status} ${body}`;
    return;
  }

  // 유저 생성 완료 — OAuth 플로우 재시작 (Google 세션 유지로 투명하게 처리됨)
  login();
}

const params = new URLSearchParams(location.search);
const code = params.get('code');
const registrationToken = params.get('registration_token');

if (registrationToken) {
  showOnboardingForm(registrationToken);
} else if (code) {
  handleCallback(code);
} else {
  document.getElementById('app').innerHTML = '<button onclick="login()">구글로 로그인</button>';
}
</script>
</body>
</html>
