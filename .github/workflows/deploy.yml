name: Deploy chapchu-api

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Test with Gradle (generate REST Docs snippets)
        run: ./gradlew :app:test --no-daemon

      - name: Generate REST Docs HTML
        run: |
          sudo apt-get install -y asciidoctor
          asciidoctor -a snippets=$(pwd)/app/build/generated-snippets \
            app/src/docs/asciidoc/index.adoc \
            -D app/build/docs/asciidoc

      - name: Build with Gradle
        run: ./gradlew :app:bootJar -x test --no-daemon

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chapchu-api:latest

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "k8s/"
          target: "~/k8s"

      - name: Apply k8s secrets
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DB_PASSWORD
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            kubectl create secret generic postgres-secret \
              --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
              -n chapchu --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic chapchu-secrets \
              --from-literal=AUTH_SERVER_URL="https://auth.chapchu.site" \
              -n chapchu --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            kubectl apply -f ~/k8s/k8s/
            kubectl rollout restart deployment/chapchu-api -n chapchu
            kubectl rollout status deployment/chapchu-api -n chapchu --timeout=4m
