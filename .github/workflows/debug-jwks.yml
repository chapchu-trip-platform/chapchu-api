name: Debug JWKS Internal URL

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check internal JWKS reachability from chapchu-api pod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            POD=$(kubectl get pod -n chapchu -l app=chapchu-api -o jsonpath='{.items[0].metadata.name}')
            echo "=== chapchu-api pod: $POD ==="
            kubectl exec -n chapchu "$POD" -- curl -s --max-time 5 \
              http://chapchu-auth.chapchu.svc.cluster.local:9000/oauth2/jwks \
              && echo "SUCCESS" || echo "FAILED"
